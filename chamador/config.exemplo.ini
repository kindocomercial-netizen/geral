; Copie este arquivo para config.ini e preencha. Não mande o config.ini para ninguém:
; ele guarda as suas chaves.

[letsbot]
; LetsBot > Configurações > API > gerar chave
chave_api =
endereco = https://letsbot.net/api/v1
caminho_mensagens = /message/fetch
; de quantos em quantos segundos olhar o WhatsApp (mínimo recomendado: 10)
intervalo_segundos = 15

[alexa]
; voicemonkey.io > Dashboard > API: copie o token
token_voice_monkey =
; nome do "Speaker" criado no Voice Monkey (ex.: loja)
dispositivo = loja
; opcionais: som antes da fala e voz (ver voicemonkey.io/docs/api); vazio = padrão
campainha =
voz =

[caixa_computador]
; toca alarme (e fala, no Windows) na caixa ligada ao computador
ligada = true
repeticoes = 3

[horario]
; fora do horário a caixa fica quieta
dias = seg,ter,qua,qui,sex,sab
abre = 08:30
fecha = 17:00
; quando a loja abre, avisa quem pediu vendedora com a loja fechada
avisar_pendentes_ao_abrir = true
minutos_entre_avisos_mesmo_cliente = 10

[deteccao]
; frases extras (uma por linha, com recuo) que também disparam o aviso
frases_extras =
